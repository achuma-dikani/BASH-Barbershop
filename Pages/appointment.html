<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | Bash's Barbershop</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>Bash's Barbershop</h1>

        <nav>
            <a href="../index.html">Home</a>
            <a href="./about.html">About Us</a>
            <a href="./services.html">Services</a>
            <a href="./price.html">Prices</a>
            <a href="./appointment.html">Book Appointment</a>
            <a href="./gallery.html">Gallery</a>
            <a href="./reviews.html">Reviews</a>
            <a href="./inquiry.html">Inquiry</a>
            <a href="./contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Book an Appointment</h2>

            <p>
                Book your appointment with Bash's Barbershop
                conveniently online.
            </p>
        </section>

        <section>

            <h2>Appointment Form</h2>

            <form>

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name">

                <br><br>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email">

                <br><br>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone">

                <br><br>

                <label for="date">Appointment Date:</label>
                <input type="date" id="date" name="date">

                <br><br>

                <label for="time">Preferred Time:</label>
                <input type="time" id="time" name="time">

                <br><br>

                <label for="service">Select Service:</label>
                <select id="service" name="service">
                    <option value="">Select a service</option>
                    <option value="haircut">Haircut</option>
                    <option value="hair-styling">Hair Styling</option>
                    <option value="grooming">Grooming Service</option>
                    <option value="children">Children's Service</option>
                </select>

                <br><br>

                <label for="message">Additional Information:</label>
                <br>
                <textarea id="message" name="message" rows="5" cols="30"></textarea>

                <br><br>

                <button type="submit">Submit Appointment</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Bash's Barbershop. All rights reserved.</p>
    </footer>

</body>
</html>
